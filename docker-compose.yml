version: "3.7"

services:
  highscore:
    image: "node:13.12-stretch"
    environment:
      NODE_ENV: "development"
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - "./:/src/"
      - "node-modules:/src/node_modules/"
    working_dir: "/src/"
    entrypoint:
      - "/src/wait-for-exit.sh"
      - "highscore-installer"
      - "nodemon"
    depends_on:
      - "db"
      - "highscore-installer"

  highscore-installer:
    image: "node:13.12-stretch"
    volumes:
      - "./:/src/"
      - "node-modules:/src/node_modules/"
    working_dir: "/src/"
    command: "npm install"

  mongo-console:
    image: "mongo-express"
    restart: "on-failure"
    environment:
      ME_CONFIG_MONGODB_SERVER: "db"
    ports:
      - "80:8081"
    depends_on:
      - "db"

  db:
    image: "mongo:4.2-bionic"
    restart: "on-failure"
    volumes:
      - "db-data:/data/db/"
      - "db-config:/data/configdb/"

volumes:
  node-modules:
  db-data:
  db-config:
