version: "3.7"

services:
  highscore:
    image: node:12
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - "./:/src/"
    working_dir: /src/
    command:
    depends_on:
      - db

  db:
    image: mongo:4.2-bionic
    restart: on-failure
    volumes:
      - "db-data:/data/db/"
      - "db-config:/data/configdb/"

  mongo-console:
    image: mongo-express
    restart: on-failure
    environment:
      ME_CONFIG_MONGODB_SERVER: db
    ports:
      - "80:8081"
    depends_on:
      - db

volumes:
  db-data:
  db-config:
