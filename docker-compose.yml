version: "3.7"

services:
  highscore:
    image: "node:13.12-stretch"
    environment:
      SCRIPT_PATH: "/highscore/node_modules/.bin/"
      NODE_ENV: "development"
      DATABASE_URI: "mongodb://db:27017/"
      DATABASE_NAME: "highscore"
      COOKIE_SECRET: "highscore_cookie_secret"
      KEY_PATH: "./devkey/server.key"
      CERTIFICATE_PATH: "./devkey/server.crt"
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - "./:/highscore/"
      - "node-modules:/highscore/node_modules/"
    working_dir: "/highscore/"
    entrypoint:
      - "/highscore/wait-for-exit.sh"
      - "highscore-installer"
      - "nodemon"
    depends_on:
      - "db"
      - "highscore-installer"

  highscore-installer:
    image: "node:13.12-stretch"
    volumes:
      - "./:/highscore/"
      - "node-modules:/highscore/node_modules/"
    working_dir: "/highscore/"
    command: "npm install"

  mongo-console:
    image: "mongo-express"
    restart: "on-failure"
    environment:
      ME_CONFIG_MONGODB_SERVER: "db"
    ports:
      - "80:8081"
    depends_on:
      - "db"

  db:
    image: "mongo:4.2-bionic"
    restart: "on-failure"
    volumes:
      - "db-data:/data/db/"
      - "db-config:/data/configdb/"

volumes:
  node-modules:
  db-data:
  db-config:
