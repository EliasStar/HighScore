<html lang="en" theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <link rel="stylesheet" href="public/css/common.css">
    <link rel="stylesheet" href="public/css/layout.css">
    <link rel="stylesheet" href="public/css/container.css">
    <link rel="stylesheet" href="public/css/path.css">
    <script src="public/js/theme.js" defer></script>
    <script src="public/js/dropup.js" defer></script>
</head>

<body>
    <main>
        <div>
            <div class="container">
                <p id="path"><a href="">Overview</a>/ Koopa Test</a></p>
            </div>
            <div class="container">
                <header>Koopa Test</header>
                <div class="content">
                    <table>
                        <thead>
                            <td>Name</td>
                            <td>Score</td>
                            <td></td>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Ofi</td>
                                <td>1min</td>
                                <td><button>&gt;
                                    </button></td>
                            </tr>
                            <tr>
                                <td>Elias*</td>
                                <td>6min</td>
                                <td><button>&gt;
                                    </button></td>
                            </tr>
                            <tr>
                                <td>Niklas Bimsmer</td>
                                <td>30min</td>
                                <td><button>&gt;
                                    </button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="container">
                <header>Add Entry</header>
                <div class="content">
                    <table>
                        <thead>
                            <td>Name</td>
                            <td></td>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Niklas Bimsmer</td>
                                <td><button>+</button></td>
                            </tr>
                            <tr>
                                <td>Ofi</td>
                                <td><button>+</button></td>
                            </tr>
                            <tr>
                                <td>Elias*</td>
                                <td><button>+</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <footer id="footer">
        <a id="logo" href="/">
            <img src="public/img/logo.jpg" alt="Dachsberg Logo" />
            <h1>HighScore</h1>
        </a>

        <span id="options">
            <span>
                <label for="gender">Geschlecht:</label>
                <select id="gender">
                    <option value="A" selected>Alle</option>
                    <option value="W">Mädchen</option>
                    <option value="M">Buben</option>
                </select>

                <span class="right">
                    <label for="class">Klasse:</label>
                    <select id="class">
                        <option value="All" selected>Alle</option>
                        <option value="6A">6A</option>
                        <option value="6B">6B</option>
                        <option value="6N">6N</option>
                        <option value="7A">7A</option>
                        <option value="7B">7A</option>
                        <option value="7N">7N</option>
                    </select>
                </span>
            </span>
        </span>

        <span id="buttons">
            <button id="add-button" class="btn" type="button"><img src="public/img/plus-light.svg" alt="Add"></button>
            <button id="theme-button" class="btn" type="button">
                <img id="icon-dark" src="public/img/dark.svg" alt="Switch Theme">
                <img id="icon-light" src="public/img/light.svg" alt="Switch Theme">
            </button>
            <button id="dropup-button" class="btn" type="button"><img src="public/img/more-light.svg"
                    alt="More"></button>
            <nav id="dropup">
                <a href="">About</a>
                <a href="">Credits</a>
                <a href="">Help</a>
            </nav>
        </span>
    </footer>
</body>

</html>
